services:
  mysql:
    image: mysql:8.4
    container_name: cashflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cashflowdb
      MYSQL_USER: cashflow
      MYSQL_PASSWORD: cashflow
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
